<style>
:root{
  --bg:#f2f3f5; --card:#fff; --ink:#1a1d21; --muted:#8a9099; --line:#eceef1;
  --green:#12a150; --green2:#0e8a44; --orange:#e8820c; --red:#e0453b;
  --gray:#3a4048; --blue:#3b6ef5; --purple:#7c5cff; --radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;background:var(--bg);
  color:var(--ink);font-size:20px}
.wrap{max-width:440px;margin:0 auto;min-height:100vh;background:var(--bg);padding:16px 16px 90px}

/* header */
.hd{display:flex;align-items:center;gap:12px;padding:6px 4px 16px}
.avatar{width:60px;height:60px;border-radius:50%;background:#dfe3ea;display:grid;
  place-items:center;overflow:hidden}
img.avatar{object-fit:cover}
/* แตะรูปโปรไฟล์เพื่อเปลี่ยนรูป */
.avwrap{position:relative;flex:0 0 auto;cursor:pointer;-webkit-tap-highlight-color:transparent}
.avwrap:active{transform:scale(.96)}
.avwrap .avcam{position:absolute;right:-2px;bottom:-2px;width:22px;height:22px;border-radius:50%;
  background:var(--ink);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg)}
.avwrap.busy{opacity:.55;pointer-events:none}
.hd .hi{color:var(--muted);font-size:16px}
.hd .nm{font-weight:800;font-size:21px}
.hd .role{color:var(--muted);font-size:16px}

/* clock card */
.clock{border-radius:var(--radius);padding:20px;display:flex;align-items:center;
  justify-content:space-between;color:#fff;margin-bottom:14px;transition:.3s}
.clock.green{background:linear-gradient(135deg,#16b357,#0e8a44)}
.clock.orange{background:linear-gradient(135deg,#f59e0b,#e8820c)}
.clock.red{background:linear-gradient(135deg,#f0564b,#d63b31)}
.clock.gray{background:linear-gradient(135deg,#4a5158,#343a41)}
.clock .lbl{font-size:16px;opacity:.9}
.clock .time{font-size:52px;font-weight:800;line-height:1;margin:2px 0}
.clock .date{font-size:16px;opacity:.9}
.act{background:#fff;border:none;border-radius:16px;width:104px;height:104px;
  display:grid;place-items:center;text-align:center;cursor:pointer;padding:8px;
  font-weight:800;font-size:16px;line-height:1.25}
.act .ico{margin-bottom:5px;display:flex;align-items:center;justify-content:center}
.clock.green .act{color:var(--green)}
.clock.orange .act{color:var(--orange)}
.clock.red .act{color:var(--red)}
.clock.gray .act{color:var(--gray)}
.act:active{transform:scale(.95)}
.act:disabled{opacity:.85;cursor:default}

/* stats */
.stats{background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  padding:6px;display:grid;grid-template-columns:1fr 1fr;margin-bottom:14px}
.st{padding:16px;text-align:center;position:relative}
.st:nth-child(odd)::after{content:"";position:absolute;right:0;top:20%;height:60%;
  width:1px;background:var(--line)}
.st:nth-child(-n+2)::before{content:"";position:absolute;bottom:0;left:15%;width:70%;
  height:1px;background:var(--line)}
.st .ic{margin-bottom:6px;display:flex;align-items:center;justify-content:center}
.st b{font-size:29px;font-weight:800;display:block}
.st span{font-size:14px;color:var(--muted)}
/* dashboard 3 ช่อง */
.stats3{grid-template-columns:repeat(3,1fr)}
.stats3 .st::after,.stats3 .st::before{display:none!important}
.stats3 .st{padding:16px 8px}
.stats3 .st:not(:last-child){border-right:1px solid var(--line)}
.st .ic svg{display:block}

/* section */
.sec{background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;margin-bottom:14px}
.sec h4{font-size:18px;font-weight:800;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);
  border-radius:12px;margin-bottom:8px}
.row .ic{width:34px;height:34px;border-radius:9px;background:#eef4ef;display:grid;
  place-items:center;color:var(--green)}
.row .grow{flex:1}
.row .t{font-weight:700;font-size:18px}
.row .s{color:var(--muted);font-size:16px}
.badge{padding:4px 11px;border-radius:20px;font-size:14px;font-weight:700}
.b-pending{background:#fdf3e5;color:var(--orange)}
.b-approved{background:#e7f7ee;color:var(--green)}
.b-rejected{background:#fdeaea;color:var(--red)}

.fab{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;border:none;width:calc(100% - 32px);max-width:408px;
  padding:14px;border-radius:14px;font-family:inherit;font-weight:800;font-size:20px;cursor:pointer}

/* bottom nav */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;
  background:#fff;border-top:1px solid var(--line);display:flex;padding:10px 0 16px}
.tab{flex:1;text-align:center;color:var(--muted);font-size:14px;cursor:pointer}
.tab .ic{display:flex;align-items:center;justify-content:center;margin-bottom:2px}
.tab.active{color:var(--blue)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(20,22,26,.5);display:none;place-items:end center;z-index:40}
.overlay.open{display:grid}
.sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:440px;padding:22px;
  animation:up .25s}
@keyframes up{from{transform:translateY(100%)}}
.sheet h3{text-align:center;font-size:23px;font-weight:800;margin-bottom:16px;position:relative}
.sheet h3 .x{position:absolute;right:0;top:0;color:var(--muted);cursor:pointer;font-weight:400}
.fld{margin-bottom:12px}
.fld label{display:block;font-weight:700;font-size:17px;margin-bottom:5px}
.fld .req{color:var(--red)}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:11px;
  padding:12px;font-family:inherit;font-size:18px;background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
.btn-dark{background:var(--ink);color:#fff;border:none;border-radius:12px;padding:13px;
  width:100%;font-family:inherit;font-weight:800;font-size:19px;cursor:pointer;margin-top:6px}
.btn-out{background:#fff;border:1px solid var(--line);color:var(--ink);border-radius:12px;
  padding:13px;width:100%;font-family:inherit;font-weight:700;font-size:18px;cursor:pointer;margin-top:8px}
.toggle{display:flex;align-items:center;gap:10px;margin:4px 0 12px}
.switch{width:42px;height:24px;border-radius:20px;background:#d4d8de;position:relative;cursor:pointer;transition:.2s}
.switch.on{background:var(--green)}
.switch::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s}
.switch.on::after{left:21px}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--ink);
  color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;z-index:60;opacity:0;
  transition:.25s;max-width:90%;text-align:center;font-size:17px}
.toast.show{opacity:1}
.spinner{width:60px;height:60px;border:4px solid var(--line);border-top-color:var(--blue);
  border-radius:50%;animation:spin .8s linear infinite;margin:60px auto}
/* ตัวโหลดระดับหน้า — ลอยกลางจอพอดี ไม่ขึ้นกับความสูงของเนื้อหา */
.spinner.page{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);margin:0;z-index:50}
@keyframes spin{to{transform:rotate(360deg)}}
/* now bar */
.nowbar{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;
  background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:12px}
.nowbar .nb-time{font-size:38px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05}
.nowbar .nb-date{font-size:19px;font-weight:800;color:var(--ink)}

/* status box */
.statebox{border-radius:var(--radius);padding:20px;margin-bottom:12px;color:#fff}
.statebox.working{background:linear-gradient(135deg,#16b357,#0e8a44)}
.statebox.done{background:#fff;color:var(--ink);border:1px solid var(--line)}
.statebox.holiday{background:linear-gradient(135deg,#4a5158,#343a41)}
.sb-badge{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:17px;
  background:rgba(255,255,255,.22);padding:5px 12px;border-radius:20px}
.statebox.done .sb-badge.gray{background:#eef0f2;color:var(--gray)}
.sb-badge.live .dot{width:9px;height:9px;border-radius:50%;background:#fff;
  animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.6)}
  70%{box-shadow:0 0 0 9px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.sb-timer{font-size:57px;font-weight:800;letter-spacing:1px;margin:14px 0 2px;
  font-variant-numeric:tabular-nums}
.sb-cap{font-size:16px;opacity:.9}
.sb-in{margin-top:12px;font-size:17px;opacity:.97}
.sb-in b{font-size:20px}
.late-tag{background:rgba(255,255,255,.25);padding:2px 8px;border-radius:10px;font-size:14px;margin-left:4px}
.sb-grid{display:flex;gap:12px;margin:12px 0}
.sb-cell{flex:1;background:#f7f8fa;border-radius:12px;padding:12px}
.sb-k{font-size:16px;color:var(--muted)}
.sb-v{font-size:26px;font-weight:800;margin-top:2px}
.sb-total{background:#f1f7f3;border-radius:12px;padding:12px 14px;font-size:18px;color:var(--gray)}
.sb-total b{color:var(--green);font-size:21px}
.sb-note{margin-top:8px;font-size:20px;font-weight:700}

/* ========= slide-to-action (จุดขายของแอป — ต้องเด่นที่สุดในหน้า) ========= */
.slidewrap{margin:2px 0 6px}
.slider{position:relative;height:78px;border-radius:999px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;user-select:none;
  touch-action:none;-webkit-tap-highlight-color:transparent;
  --p:0;                       /* ความคืบหน้าการลาก 0..1 (ตั้งค่าจาก JS) */
  box-shadow:0 10px 24px -8px var(--sl-glow,rgba(0,0,0,.35)),
             inset 0 2px 0 rgba(255,255,255,.28),
             inset 0 -3px 8px rgba(0,0,0,.18)}
.slider.green{--sl-a:#18c163;--sl-b:#0c8f47;--sl-ink:#0b7a3c;--sl-glow:rgba(18,161,80,.55);
  background:linear-gradient(135deg,var(--sl-a),var(--sl-b))}
.slider.orange{--sl-a:#ffa42b;--sl-b:#e0700a;--sl-ink:#b85f06;--sl-glow:rgba(232,130,12,.55);
  background:linear-gradient(135deg,var(--sl-a),var(--sl-b))}
.slider.gray{--sl-a:#dfe3e8;--sl-b:#ced4db;--sl-ink:#8a9099;--sl-glow:rgba(0,0,0,.12);
  background:linear-gradient(135deg,var(--sl-a),var(--sl-b));
  box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -3px 8px rgba(0,0,0,.06)}

/* รอยทางที่ลากผ่านแล้ว — สว่างขึ้นตามระยะ */
.slide-fill{position:absolute;left:0;top:0;bottom:0;width:78px;border-radius:999px;
  background:linear-gradient(90deg,rgba(255,255,255,.42),rgba(255,255,255,.14));
  transition:width .25s}
.slider.gray .slide-fill{display:none}

/* แสงกวาดผ่านตัวปุ่ม บอกทิศทางที่ต้องลาก */
.slider:not(.disabled)::after{content:'';position:absolute;top:0;bottom:0;left:0;width:44%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);
  transform:translateX(-120%);animation:slSheen 2.6s ease-in-out infinite;pointer-events:none}
@keyframes slSheen{0%{transform:translateX(-120%)}60%,100%{transform:translateX(330%)}}

.slide-text{position:relative;z-index:2;font-weight:800;font-size:21px;letter-spacing:.2px;
  color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.22);pointer-events:none;
  padding-left:64px;padding-right:44px;
  opacity:calc(1 - var(--p) * .85);transition:opacity .18s;
  animation:slBlink 1.5s ease-in-out infinite}
.slider.gray .slide-text{color:#fff;text-shadow:none;animation:none;padding-left:64px}
@keyframes slBlink{0%,100%{opacity:1}50%{opacity:.55}}
.slider.dragging .slide-text,.slider.armed .slide-text{animation:none}

/* ลูกศรวิ่ง ››› ชี้ทางให้ผู้ใช้รู้ทันทีว่าต้องสไลด์ */
.slide-arrows{position:absolute;z-index:2;right:20px;top:50%;transform:translateY(-50%);
  display:flex;gap:3px;pointer-events:none;opacity:calc(1 - var(--p))}
.slide-arrows i{display:block;width:9px;height:9px;border-right:3px solid #fff;
  border-top:3px solid #fff;transform:rotate(45deg);border-radius:2px;opacity:.25;
  animation:slChev 1.2s linear infinite}
.slide-arrows i:nth-child(2){animation-delay:.16s}
.slide-arrows i:nth-child(3){animation-delay:.32s}
@keyframes slChev{0%,100%{opacity:.22}45%{opacity:1}}

/* ลูกบิดกลม สีขาว เงาเข้ม — จับแล้วลากไปขวา */
.slide-knob{position:absolute;z-index:3;left:6px;top:6px;width:66px;height:66px;border-radius:50%;
  background:radial-gradient(120% 120% at 30% 25%,#fff,#eef1f5);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 14px rgba(0,0,0,.28),0 1px 0 rgba(255,255,255,.9) inset;
  cursor:grab;transition:transform .25s}
.slider:not(.disabled) .slide-knob:active{cursor:grabbing}
.slider.green .slide-knob{color:var(--sl-ink)}
.slider.orange .slide-knob{color:var(--sl-ink)}
.slider.gray .slide-knob{color:#a2a9b2;box-shadow:0 2px 6px rgba(0,0,0,.12)}
/* วงแหวนเต้นรอบลูกบิด (ใช้ pseudo-element เพราะ transform ของลูกบิดถูก JS คุมอยู่) */
.slide-knob::before{content:'';position:absolute;inset:-4px;border-radius:50%;
  border:3px solid rgba(255,255,255,.85);animation:slRing 1.5s ease-out infinite;pointer-events:none}
@keyframes slRing{0%{transform:scale(1);opacity:.85}70%,100%{transform:scale(1.35);opacity:0}}
.slider.gray .slide-knob::before,.slider.dragging .slide-knob::before,
.slider.armed .slide-knob::before{display:none}

.slider.disabled{opacity:.85}
.slider.disabled .slide-knob{cursor:default}
.slider.armed{animation:slPop .35s ease}
@keyframes slPop{50%{transform:scale(1.02)}}

/* ข้อความใบ้ใต้ปุ่ม */
.slide-hint{text-align:center;font-size:15px;color:var(--muted);margin-top:8px;
  animation:slBlink 1.5s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){
  .slide-text,.slide-hint,.slide-arrows i,.slide-knob::before,.slider::after,.slider.armed{animation:none!important}
  .slide-arrows i{opacity:.9}
}

/* ---- OT ---- */
.ot-box{margin-top:10px;background:rgba(255,255,255,.6);border-radius:12px;padding:11px 14px}
.statebox .ot-box{background:rgba(255,255,255,.22)}
.ot-line{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.ot-k{font-size:17px;opacity:.9}
.ot-v{font-size:21px;font-weight:800}
.ot-tag{font-size:14px;font-weight:700;padding:3px 10px;border-radius:10px}
.ot-tag.ok{background:#d6f3e2;color:var(--green2)}
.ot-tag.wait{background:#fdecd2;color:var(--orange)}
.ot-tag.off{background:#e9ebee;color:var(--muted)}
.ot-note{margin-top:6px;font-size:15px;opacity:.85;line-height:1.45}
.ot-hint{margin-top:10px;display:flex;align-items:center;gap:7px;font-size:16px;
  background:rgba(255,255,255,.22);border-radius:10px;padding:9px 12px;line-height:1.4}
.ot-stat{display:flex;gap:12px}
.ot-stat>div{flex:1;background:#f7f8fa;border-radius:12px;padding:12px;text-align:center}
.ot-stat b{display:block;font-size:22px;font-weight:800}
.ot-stat span{font-size:15px;color:var(--muted)}
.lnk-cancel{display:inline-block;margin-top:5px;font-size:15px;color:var(--red);
  cursor:pointer;text-decoration:underline}
.sh-sub{color:var(--muted);font-size:16px;margin:-4px 0 10px}
.sh-note{color:var(--muted);font-size:14px;margin:6px 0 4px;line-height:1.4}

/* leave balances */
.balist{display:flex;flex-direction:column;gap:8px}
.barow{display:flex;align-items:center;justify-content:space-between;
  border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.barow .bk{font-weight:700;font-size:18px}
.barow .bv b{font-size:26px}
.barow .bv span{font-size:16px;color:var(--muted)}

.hide{display:none!important}
.page{display:none}.page.on{display:block}
.empty{text-align:center;color:var(--muted);padding:30px;font-size:17px}

/* ปฏิทินวันหยุด */
.calbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.calbar b{font-size:18px}
.calbar button{background:#fff;border:1px solid var(--line);border-radius:9px;padding:6px 14px;
  font-family:inherit;font-weight:800;cursor:pointer;font-size:20px;color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{text-align:center;font-size:14px;color:var(--muted);font-weight:700;padding:2px}
.cal .cell{min-height:44px;border:1px solid var(--line);border-radius:9px;padding:4px;
  font-size:16px;font-weight:700;color:var(--ink)}
.cal .cell.hol{background:#fdeaea;color:var(--red)}
.cal .cell.off{background:#eef0f2;color:#889}
.cal .cell.today{border-color:var(--blue);border-width:2px}
.cal .cell .nm{font-size:12px;font-weight:400;line-height:1.15;margin-top:2px}
</style>
