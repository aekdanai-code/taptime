<script>
/* ============ เมนู: จัดการพนักงาน ============
 * - ค้นหา + กรอง (สาขา / ตำแหน่ง / สถานะ / สิทธิ์)
 * - แบ่งหน้า 10 / 20 / 50 / 100 (เริ่มต้น 20)
 * - รูปพนักงานถูกครอปกึ่งกลางเป็นจัตุรัส 150x150 ก่อนบันทึก
 * ============================================ */

var EMP_STATE={q:'',branch:'',pos:'',status:'',role:'',page:1,per:20};

function renderEmployees(){
  loading();
  run('listEmployees').then(function(list){
    window._emps=list;
    EMP_STATE.page=1;
    drawEmpPage();
  });
}

/* ---- กรอง + ค้นหา ---- */
function empFiltered(){
  var s=EMP_STATE, q=s.q.trim().toLowerCase();
  return (window._emps||[]).filter(function(e){
    if(s.branch && e.branchId!==s.branch) return false;
    if(s.pos    && e.position!==s.pos)    return false;
    if(s.role   && (e.role||'employee')!==s.role) return false;
    if(s.status){
      var st=String(e.status||'active').toLowerCase();
      if(s.status==='active'   && st==='inactive') return false;
      if(s.status==='inactive' && st!=='inactive') return false;
    }
    if(!q) return true;
    return [e.name,e.nickname,e.phone,e.email,e.position,e.branchName,e.nationalId]
      .some(function(v){return String(v||'').toLowerCase().indexOf(q)!==-1;});
  });
}

function drawEmpPage(){
  var s=EMP_STATE, all=empFiltered();
  var pages=Math.max(1,Math.ceil(all.length/s.per));
  if(s.page>pages) s.page=pages;
  var from=(s.page-1)*s.per, rowsData=all.slice(from,from+s.per);

  var rows=rowsData.map(function(e,i){
    var av=e.photo
      ? '<img src="'+e.photo+'" style="width:34px;height:34px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:8px">'
      : '<span style="display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#e7eaee;color:#556;vertical-align:middle;margin-right:8px">'+svgI('user',{size:19})+'</span>';
    var inactive=String(e.status||'active').toLowerCase()==='inactive';
    var nick=e.nickname?' <span style="color:var(--muted);font-weight:400">('+esc(e.nickname)+')</span>':'';
    var acc=accountState(e);
    return '<tr'+(inactive?' style="opacity:.55"':'')+'>'+
      '<td>'+(from+i+1)+'</td>'+
      '<td>'+av+'<b>'+esc(e.name)+'</b>'+nick+
        '<br><span style="color:var(--muted);font-size:12px;margin-left:42px">'+esc(e.phone||'')+'</span></td>'+
      '<td>'+esc(e.branchName||'')+'</td>'+
      '<td>'+esc(e.position||'')+
        (e.salaryType?'<div style="color:var(--muted);font-size:11.5px;margin-top:2px">'+esc(e.salaryType)+'</div>':'')+'</td>'+
      '<td>'+(inactive
        ? '<span class="tag t-gray">ลาออก</span>'
        : '<span class="tag t-green">ทำงานอยู่</span>')+'</td>'+
      '<td><span class="tag '+acc.cls+'" title="'+esc(acc.tip)+'">'+acc.label+'</span>'+
        (e.email?'<div style="color:var(--muted);font-size:11.5px;margin-top:3px">'+esc(e.email)+'</div>':'')+'</td>'+
      '<td class="act">'+
        (e.email
          ? '<span class="btn btn-sm btn-green" title="'+esc(acc.btnTip)+'" onclick="resendInvite(\''+e.empId+'\')">'+
              svgI('mail',{size:15})+' '+acc.btnText+'</span> '
          : '')+
        '<span class="btn btn-sm btn-ghost" onclick="editEmp(\''+e.empId+'\')">แก้ไข</span> '+
        '<span class="btn btn-sm btn-red" onclick="delEmp(\''+e.empId+'\')">ลบ</span>'+
      '</td></tr>';
  }).join('');

  var branchOpts='<option value="">ทุกสาขา</option>'+(BOOT.branches||[]).map(function(b){
    return '<option value="'+b.branchId+'"'+(EMP_STATE.branch===b.branchId?' selected':'')+'>'+esc(b.name)+'</option>';}).join('');
  var posOpts='<option value="">ทุกตำแหน่ง</option>'+(BOOT.positions||[]).map(function(p){
    return '<option'+(EMP_STATE.pos===p.name?' selected':'')+'>'+esc(p.name)+'</option>';}).join('');
  var statusOpts=[['','ทุกสถานะ'],['active','ทำงานอยู่'],['inactive','ลาออก']].map(function(o){
    return '<option value="'+o[0]+'"'+(EMP_STATE.status===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('');
  var roleOpts=[['','ทุกสิทธิ์'],['employee','พนักงาน'],['head','หัวหน้างาน'],['admin','แอดมิน']].map(function(o){
    return '<option value="'+o[0]+'"'+(EMP_STATE.role===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('');
  var perOpts=[10,20,50,100].map(function(n){
    return '<option value="'+n+'"'+(EMP_STATE.per===n?' selected':'')+'>'+n+' รายการ</option>';}).join('');

  $('content').innerHTML=
    '<div class="page-title">จัดการพนักงาน</div>'+
    '<div class="page-sub">สร้างและจัดการพนักงานในระบบ</div>'+
    '<div class="card">'+
      '<div class="card-head"><div class="ic">'+svgI('users')+'</div><div><h3>รายชื่อพนักงาน</h3>'+
      '<p>ทั้งหมด '+(window._emps||[]).length+' คน'+
        (all.length!==(window._emps||[]).length?(' · ตรงเงื่อนไข '+all.length+' คน'):'')+'</p></div>'+
      '<div style="margin-left:auto"><button class="btn btn-dark" onclick="editEmp()">+ เพิ่มพนักงาน</button></div></div>'+

      /* ---- แถบค้นหา + กรอง ---- */
      '<div class="filterbar">'+
        '<input id="emp_q" class="fb-search" placeholder="ค้นหาชื่อ ชื่อเล่น เบอร์โทร อีเมล..." value="'+esc(EMP_STATE.q)+'">'+
        '<select id="emp_branch" onchange="empFilter()">'+branchOpts+'</select>'+
        '<select id="emp_pos" onchange="empFilter()">'+posOpts+'</select>'+
        '<select id="emp_status" onchange="empFilter()">'+statusOpts+'</select>'+
        '<select id="emp_role" onchange="empFilter()">'+roleOpts+'</select>'+
        (EMP_STATE.q||EMP_STATE.branch||EMP_STATE.pos||EMP_STATE.status||EMP_STATE.role
          ? '<span class="btn btn-sm btn-ghost" onclick="empClearFilter()">ล้างตัวกรอง</span>':'')+
      '</div>'+

      '<table><thead><tr><th>ลำดับ</th><th>ชื่อ</th><th>สาขา</th><th>ตำแหน่ง</th>'+
      '<th>สถานะ</th><th>บัญชีผู้ใช้</th><th>จัดการ</th></tr></thead><tbody>'+
      (rows||'<tr><td colspan="7" class="empty">'+
        ((window._emps||[]).length?'ไม่พบพนักงานที่ตรงเงื่อนไข':'ยังไม่มีพนักงาน — กดปุ่มเพิ่มเพื่อสร้างรายการใหม่')+
        '</td></tr>')+
      '</tbody></table>'+

      /* ---- แบ่งหน้า ---- */
      '<div class="pager">'+
        '<div class="pg-left">แสดง <select id="emp_per" onchange="empPer(this.value)">'+perOpts+'</select> ต่อหน้า</div>'+
        '<div class="pg-info">'+(all.length?((from+1)+'–'+Math.min(from+s.per,all.length)+' จาก '+all.length):'0 รายการ')+'</div>'+
        '<div class="pg-btns">'+
          '<span class="btn btn-sm btn-ghost'+(s.page<=1?' disabled':'')+'" onclick="empPage('+(s.page-1)+')">‹ ก่อนหน้า</span>'+
          '<span class="pg-now">หน้า '+s.page+' / '+pages+'</span>'+
          '<span class="btn btn-sm btn-ghost'+(s.page>=pages?' disabled':'')+'" onclick="empPage('+(s.page+1)+')">ถัดไป ›</span>'+
        '</div>'+
      '</div>'+
    '</div>';

  /* ค้นหาแบบพิมพ์ไปกรองไป (คงตำแหน่งเคอร์เซอร์ไว้) */
  var qEl=$('emp_q');
  qEl.oninput=function(){ EMP_STATE.q=this.value; EMP_STATE.page=1; drawEmpPage();
    var el=$('emp_q'); el.focus(); el.setSelectionRange(el.value.length,el.value.length); };
}

/**
 * สถานะบัญชีผู้ใช้ของพนักงาน 1 คน
 *   ไม่มีอีเมล        -> ยังเข้าใช้ระบบไม่ได้เลย
 *   มีอีเมล ยังไม่เชิญ -> รอส่งอีเมลเชิญ
 *   เชิญแล้ว ยังไม่เคย login -> รอพนักงานตั้งรหัสผ่าน
 *   เคย login แล้ว    -> พร้อมใช้งาน
 */
function accountState(e){
  if(!e.email) return {
    cls:'t-gray', label:'ไม่มีอีเมล',
    tip:'ยังเข้าใช้ระบบไม่ได้ — กรอกอีเมลก่อน ระบบจะส่งคำเชิญให้อัตโนมัติ',
    btnText:'', btnTip:''
  };
  if(e.lastLoginAt) return {
    cls:'t-green', label:'พร้อมใช้งาน',
    tip:'เข้าสู่ระบบล่าสุด '+fmtStamp(e.lastLoginAt),
    btnText:'ส่งลิงก์ตั้งรหัสใหม่',
    btnTip:'ส่งอีเมลลิงก์ตั้งรหัสผ่านใหม่ (กรณีพนักงานลืมรหัส)'
  };
  if(e.invitedAt) return {
    cls:'t-orange', label:'รอตั้งรหัสผ่าน',
    tip:'ส่งคำเชิญเมื่อ '+fmtStamp(e.invitedAt)+' — ยังไม่เคยเข้าสู่ระบบ',
    btnText:'ส่งอีเมลเชิญใหม่',
    btnTip:'ส่งอีเมลเชิญตั้งรหัสผ่านอีกครั้ง (ลิงก์เดิมอาจหมดอายุ)'
  };
  return {
    cls:'t-gray', label:'ยังไม่ได้เชิญ',
    tip:'มีอีเมลแล้วแต่ยังไม่เคยส่งคำเชิญ',
    btnText:'ส่งอีเมลเชิญ',
    btnTip:'ส่งอีเมลเชิญให้พนักงานตั้งรหัสผ่าน'
  };
}

/** timestamp ISO -> 'DD/MM/YYYY HH:mm' */
function fmtStamp(v){
  if(!v) return '-';
  var d=new Date(v);
  if(isNaN(d)) return String(v);
  var p=function(n){return ('0'+n).slice(-2);};
  return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes());
}

/** ส่งอีเมลเชิญ / ลิงก์ตั้งรหัสผ่านใหม่ */
function resendInvite(empId){
  var e=(window._emps||[]).filter(function(x){return x.empId===empId;})[0];
  if(!e) return;
  if(!e.email){ toast('พนักงานคนนี้ยังไม่มีอีเมล'); return; }

  var acc=accountState(e);
  openModal(
    '<h2>'+acc.btnText+'</h2>'+
    '<div class="msub">'+esc(e.name)+'</div>'+
    '<div style="background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:6px">'+
      '<div style="display:flex;gap:10px;align-items:center">'+
        '<span style="color:var(--muted)">'+svgI('mail',{size:18})+'</span>'+
        '<b>'+esc(e.email)+'</b></div>'+
      '<div style="color:var(--muted);font-size:13px;margin-top:8px">'+esc(acc.tip)+'</div>'+
    '</div>'+
    '<div style="color:var(--muted);font-size:12.5px;line-height:1.7;margin-bottom:4px">'+
      'พนักงานจะได้รับลิงก์สำหรับตั้งรหัสผ่าน ลิงก์ใช้ได้ครั้งเดียวและมีอายุจำกัด<br>'+
      'หมายเหตุ: ถ้ายังไม่ได้ตั้ง Custom SMTP จะส่งได้เฉพาะอีเมลของสมาชิกทีมใน Supabase เท่านั้น</div>'+
    '<div class="actions">'+
      '<button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>'+
      '<button class="btn btn-dark" id="inv_go" onclick="doResendInvite(\''+empId+'\')">ส่งอีเมล</button>'+
    '</div>');
}

function doResendInvite(empId){
  var btn=$('inv_go');
  if(btn){ btn.disabled=true; btn.textContent='กำลังส่ง...'; }
  run('inviteEmployee',empId).then(function(r){
    closeModal();
    if(r && r.redirectTo && /localhost|127\.0\.0\.1/.test(r.redirectTo)){
      toast('ส่งแล้ว แต่ลิงก์ชี้ไป '+r.redirectTo+' — ตรวจ Site URL ใน Supabase');
    } else {
      toast(r && r.mode==='reset'
        ? 'ส่งลิงก์ตั้งรหัสผ่านใหม่ไปที่ '+r.email+' แล้ว'
        : 'ส่งอีเมลเชิญไปที่ '+((r&&r.email)||'')+' แล้ว');
    }
    renderEmployees();
  }).catch(function(e){
    if(btn){ btn.disabled=false; btn.textContent='ส่งอีเมล'; }
    toast('ส่งไม่สำเร็จ: '+e.message);
  });
}

function empFilter(){
  EMP_STATE.branch=$('emp_branch').value;
  EMP_STATE.pos=$('emp_pos').value;
  EMP_STATE.status=$('emp_status').value;
  EMP_STATE.role=$('emp_role').value;
  EMP_STATE.page=1; drawEmpPage();
}
function empClearFilter(){
  EMP_STATE={q:'',branch:'',pos:'',status:'',role:'',page:1,per:EMP_STATE.per};
  drawEmpPage();
}
function empPer(v){ EMP_STATE.per=Number(v)||20; EMP_STATE.page=1; drawEmpPage(); }
function empPage(p){
  var all=empFiltered(), pages=Math.max(1,Math.ceil(all.length/EMP_STATE.per));
  if(p<1||p>pages) return;
  EMP_STATE.page=p; drawEmpPage();
}

/**
 * ครอปรูปกึ่งกลางเป็นจัตุรัสแล้วย่อเป็น 150x150 ก่อนเก็บเป็น dataURL
 * (ขนาดคงที่ทำให้แถวในตารางและ avatar ฝั่งพนักงานคมเท่ากันหมด)
 */
function pickPhoto(input){
  var file=input.files[0]; if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    var img=new Image();
    img.onload=function(){
      var SIZE=150;
      var side=Math.min(img.width,img.height);          // ด้านสั้นสุด = ขนาดจัตุรัส
      var sx=(img.width-side)/2, sy=(img.height-side)/2; // ครอปกึ่งกลาง
      var c=document.createElement('canvas'); c.width=SIZE; c.height=SIZE;
      var ctx=c.getContext('2d');
      ctx.fillStyle='#fff'; ctx.fillRect(0,0,SIZE,SIZE);  // กันพื้นโปร่งใสของ PNG
      ctx.drawImage(img,sx,sy,side,side,0,0,SIZE,SIZE);
      _empPhoto=c.toDataURL('image/jpeg',0.85);
      var el=$('ph_img');
      el.outerHTML='<img id="ph_img" src="'+_empPhoto+'" style="width:88px;height:88px;border-radius:50%;object-fit:cover">';
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

function saveEmp(empId){
  var emp={
    empId:empId||'',
    name:$('e_name').value.trim(),
    nickname:$('e_nick').value.trim(),
    gender:$('e_gender').value,
    birthDate:$('e_birth').value,
    nationality:$('e_nation').value.trim(),
    nationalId:$('e_natid').value.trim(),
    address:$('e_addr').value.trim(),
    phone:$('e_phone').value.trim(),
    email:$('e_email').value.trim(),
    branchId:$('e_branch').value,
    position:$('e_pos').value,
    salaryType:$('e_stype').value,
    startDate:$('e_start').value,
    role:$('e_role').value,
    status:$('e_status').value,
    photo:_empPhoto
  };
  if(!emp.name){toast('กรุณากรอกชื่อ');return;}
  run('saveEmployee',emp).then(function(){closeModal();toast('บันทึกพนักงานแล้ว');renderEmployees();})
    .catch(function(e){toast('ผิดพลาด: '+e.message);});
}

function delEmp(empId){
  if(!confirm('ลบพนักงานคนนี้?'))return;
  run('deleteEmployee',empId).then(function(){toast('ลบแล้ว');renderEmployees();});
}
</script>
