<script>
/* ============ เมนู: เช็คชื่อ เข้า-ออก ============ */

function renderAttendance(){
  loading();
  window._attDate=window._attDate||todayStr();
  window._attFilter=window._attFilter||'all';
  loadAtt();
}

function loadAtt(){
  var date=window._attDate,branch=window._attBranch||'';
  // เปลี่ยนวันที่/สาขา ก็ต้องเห็นว่ากำลังโหลด ไม่ใช่ค้างตารางเดิมไว้เฉย ๆ
  $('content').innerHTML=loadBox('กำลังโหลดข้อมูลการลงเวลา...');
  run('listAttendance',date,branch).then(function(list){
    run('listEmployees').then(function(emps){
      window._attEmps=emps;
      var byEmp={};list.forEach(function(a){byEmp[a.empId]=a;});
      var ontime=0,late=0;list.forEach(function(a){if(a.status==='late')late++;else if(a.checkInTime)ontime++;});
      var notYet=emps.filter(function(e){return !byEmp[e.empId]&&(!branch||e.branchId===branch);}).length;

      // รวมพนักงานที่ยังไม่เช็คอินเข้าตาราง (virtual row)
      var merged=[];
      emps.forEach(function(e){
        if(branch&&e.branchId!==branch)return;
        if(byEmp[e.empId])merged.push(byEmp[e.empId]);
        else merged.push({empId:e.empId,empName:e.name,branchId:e.branchId,date:date,
          status:'notyet',dayType:'วันปกติ',_virtual:true});
      });

      var f=window._attFilter;
      var filtered=merged.filter(function(a){
        if(f==='all')return true;
        if(f==='ontime')return a.status==='ontime';
        if(f==='late')return a.status==='late';
        if(f==='notyet')return a.status==='notyet';
      });

      var rows=filtered.map(function(a,i){
        return '<tr>'+
          '<td>'+(i+1)+'</td>'+
          '<td><b>'+esc(a.empName)+'</b></td>'+
          '<td>'+esc(a.date)+'</td>'+
          '<td><span class="tag t-blue">'+esc(a.dayType||'วันปกติ')+'</span></td>'+
          '<td>'+(a.checkInTime||'-')+'</td>'+
          '<td>'+(a.lateMinutes?a.lateMinutes+' นาที':'-')+'</td>'+
          '<td>'+(a.checkOutTime||'-')+'</td>'+
          '<td>'+otCell(a)+'</td>'+
          '<td>'+attTag(a.status)+'</td>'+
          '<td>'+attActions(a)+'</td>'+
        '</tr>';
      }).join('');

      $('content').innerHTML=
        '<div class="page-title">รายการเช็คชื่อ เข้า-ออก งาน</div>'+
        '<div class="page-sub">รายการเช็คชื่อเข้า-ออกของแต่ละสาขาภายในวัน</div>'+
        '<div class="card">'+
          '<div class="toolbar">'+
            '<input type="date" value="'+date+'" style="max-width:180px" onchange="window._attDate=this.value;loadAtt()">'+
            '<select style="max-width:200px" onchange="window._attBranch=this.value;loadAtt()">'+
              '<option value="">ทุกสาขา</option>'+branchOptions(branch)+'</select>'+
          '</div>'+
          '<div class="stat-grid" style="grid-template-columns:repeat(3,1fr)">'+
            stat('s-green',ontime,'เข้างานตรงเวลา')+
            stat('s-gray',notYet,'ยังไม่เข้างาน')+
            stat('s-orange',late,'มาสาย')+
          '</div>'+
          '<div class="chips">'+
            chip('all','ทั้งหมด')+chip('ontime','ปกติ')+chip('late','สาย')+chip('notyet','ยังไม่มา')+
          '</div>'+
          '<div style="overflow:auto"><table><thead><tr><th>ลำดับ</th><th>ชื่อ</th><th>วันที่</th>'+
          '<th>ประเภทวัน</th><th>เวลาเข้า</th><th>สาย</th><th>เวลาออก</th>'+
          (otEnabled()?'<th>OT (ดิบ / นับได้)</th>':'')+
          '<th>สถานะ</th><th>จัดการ</th></tr></thead><tbody>'+
          (rows||'<tr><td colspan="'+(otEnabled()?10:9)+'" class="empty">ไม่มีรายการ</td></tr>')+
          '</tbody></table></div>'+
        '</div>';
    });
  });
}

/* ช่อง OT: ดิบ / นับได้ + สถานะ + ปุ่มคีย์ให้ (โหมด admin_only)
 * ปิดระบบ OT อยู่ -> คืนค่าว่าง (คอลัมน์ถูกซ่อนไปแล้ว)
 */
function otCell(a){
  if(!otEnabled()) return '';
  var raw=Number(a.otMinutesRaw||0), got=Number(a.otMinutes||0);
  var st=String(a.otStatus||'none');
  var tag={approved:'<span class="tag t-green">นับแล้ว</span>',
           pending:'<span class="tag t-orange">รออนุมัติ</span>',
           rejected:'<span class="tag t-red">ปฏิเสธ</span>'}[st]||'';
  var mode=(BOOT.otPolicy||{}).mode;
  var btn = (mode==='admin_only' && a.checkOutTime && !got)
    ? ' <span class="btn btn-sm btn-ghost" onclick="openAdminOt(\''+esc(a.empId)+'\',\''+
      esc(a.date)+'\')">คีย์ OT</span>' : '';
  if(!raw && !got) return '<span style="color:var(--muted)">-</span>'+btn;
  return '<span style="color:var(--muted)">'+raw+'</span> / <b>'+got+'</b> นาที '+tag+btn;
}

/* แอดมินคีย์ OT ให้พนักงาน */
function openAdminOt(empId,date){
  openModal('<h3>บันทึก OT ให้พนักงาน</h3>'+
    '<div class="f-row">'+
      fld('วันที่',true,'<input type="date" id="aot_d" value="'+esc(date)+'">')+
      fld('ประเภท',false,'<select id="aot_k">'+
        '<option value="after_shift">หลังเลิกงาน</option>'+
        '<option value="before_shift">ก่อนเข้างาน</option>'+
        '<option value="holiday_work">ทำงานวันหยุด</option></select>')+
    '</div>'+
    '<div class="f-row">'+
      fld('เวลาเริ่ม',false,'<input type="time" id="aot_s" value="'+
        esc((((BOOT.branches||[])[0]||{}).workEnd)||'17:00')+'">')+
      fld('เวลาสิ้นสุด',false,'<input type="time" id="aot_e" value="20:00">')+
    '</div>'+
    fld('หรือระบุจำนวนนาทีโดยตรง',false,'<input type="number" id="aot_m" min="0" placeholder="เว้นว่างถ้ากรอกเวลาแล้ว">')+
    fld('เหตุผล',false,'<input id="aot_r" placeholder="เช่น ลืมเช็คเอาท์">')+
    '<div class="actions"><span class="btn btn-ghost" onclick="closeModal()">ยกเลิก</span>'+
    '<button class="btn btn-dark" onclick="saveAdminOt(\''+esc(empId)+'\')">บันทึก</button></div>');
}
function saveAdminOt(empId){
  run('adminCreateOt',{empId:empId,date:$('aot_d').value,kind:$('aot_k').value,
    start:$('aot_s').value,end:$('aot_e').value,
    minutes:$('aot_m').value,reason:$('aot_r').value.trim()})
    .then(function(){ closeModal(); toast('บันทึก OT แล้ว'); loadAtt(); })
    .catch(function(e){ toast(e.message||e); });
}

function chip(v,label){return '<div class="chip'+(window._attFilter===v?' active':'')+
  '" onclick="window._attFilter=\''+v+'\';loadAtt()">'+label+'</div>';}
function attTag(s){return {ontime:'<span class="tag t-green">ปกติ</span>',
  late:'<span class="tag t-orange">สาย</span>',
  notyet:'<span class="tag t-gray">ยังไม่มา</span>'}[s]||'<span class="tag t-gray">-</span>';}
function attActions(a){
  if(a.status==='notyet')
    return '<span class="btn btn-sm btn-green" onclick="manualIn(\''+a.empId+'\')">เช็คชื่อแทน (เข้า)</span>';
  if(!a.checkOutTime)
    return '<span class="btn btn-sm btn-dark" onclick="manualOut(\''+a.empId+'\')">เช็คชื่อแทน (ออก)</span>';
  return '<span class="btn btn-sm btn-ghost" onclick="editOut(\''+a.recId+'\',\''+esc(a.empName)+'\',\''+(a.checkOutTime||'')+'\')">แก้เวลาออก</span>';
}

function manualIn(empId){
  var e=(window._attEmps||[]).filter(function(x){return x.empId===empId;})[0]||{};
  openModal('<h2>ลงเวลาแทนพนักงาน (เข้า)</h2><div class="msub">'+esc(e.name)+' · วันที่ '+window._attDate+'</div>'+
    fld('เวลาเข้างาน',true,'<input id="m_time" type="time" value="08:00">')+
    '<div style="height:12px"></div>'+
    fld('ประเภทวัน',false,'<select id="m_daytype">'+opt(['วันปกติ','วันหยุด','วันนักขัตฤกษ์'])+'</select>')+
    '<div class="actions"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>'+
    '<button class="btn btn-dark" onclick="doManualIn(\''+empId+'\')">บันทึก</button></div>');
}
function doManualIn(empId){
  run('manualCheckIn',empId,window._attDate,$('m_time').value,$('m_daytype').value)
    .then(function(){closeModal();toast('ลงเวลาเข้าแล้ว');loadAtt();})
    .catch(function(e){toast(e.message);});
}

function manualOut(empId){
  openModal('<h2>ลงเวลาแทนพนักงาน (ออก)</h2><div class="msub">วันที่ '+window._attDate+'</div>'+
    fld('เวลาออกงาน',true,'<input id="mo_time" type="time" value="17:00">')+
    '<div class="actions"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>'+
    '<button class="btn btn-dark" onclick="doManualOut(\''+empId+'\')">บันทึก</button></div>');
}
function doManualOut(empId){
  run('manualCheckOut',empId,window._attDate,$('mo_time').value)
    .then(function(){closeModal();toast('ลงเวลาออกแล้ว');loadAtt();})
    .catch(function(e){toast(e.message);});
}

function editOut(recId,name,cur){
  openModal('<h2>แก้ไขเวลาออกงาน — '+esc(name)+'</h2>'+
    fld('เวลาออกงาน',true,'<input id="eo_time" type="time" value="'+(cur||'17:00')+'">')+
    '<div class="actions"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>'+
    '<button class="btn btn-dark" onclick="doEditOut(\''+recId+'\')">บันทึก</button></div>');
}
function doEditOut(recId){
  run('editCheckOut',recId,$('eo_time').value)
    .then(function(){closeModal();toast('แก้ไขแล้ว');loadAtt();}).catch(function(e){toast(e.message);});
}
</script>
